<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
        
        .dogfact{
            height: auto;
            width: 1500px;
            border: 1px solid black;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: brown;
        }
        .click_me{
            height: 100px;
            width: 400px;
            background-color: red;
            color: white;
            border-radius: 50px;
            font-size: 25px;
            margin: 30px 30px 30px 30px;
        }
        .fact{
            width: 1000px;
            height: 300px;
            border-radius: 50px;
            font-size: 45px;
            color: blue;
            margin: 30px 30px 30px 30px;
            box-sizing: border-box;
            white-space: pre-wrap; 
            overflow-x: hidden;     
            overflow-y: auto; 
            max-height: 250px; 
            
        }
    </style>
</head>
<body>
    <div class="dogfact">
        <h1 class="heading">DOG FACTS</h1>
        <input type="textarea" id="fact" class="fact" placeholder="fact will be seen here" readonly>
        <br>
        <button class ="click_me">click me to read a dog fact</button>
    </div>
    <script src="jscript.js"></script>
</body>
</html>
