<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css/index.css">
    <title>Calculator</title>
</head>
<body>
    <div class="calculator">
        <div class="screen"><input type="text" class="show" readonly></div>
        <div class="buttons">
            <button class="num1" onclick="X1()">1</button>
            <button class="num2" onclick="X2()">2</button>
            <button class="num3" onclick="X3()">3</button>
            <button class="clr" onclick="Xclr()">clr</button>
            <button class="num4" onclick="X4()">4</button>
            <button class="num5" onclick="X5()">5</button>
            <button class="num6" onclick="X6()">6</button>
            <button class="minus" onclick="Xminus()">-</button>
            <button class="num7" onclick="X7()">7</button>
            <button class="num8" onclick="X8()">8</button>
            <button class="num9" onclick="X9()">9</button>
            <button class="plus" onclick="Xplus()">+</button>
            <button class="num0" onclick="X0()">0</button>
            <button class="div" onclick="Xdiv()">/</button>
            <button class="mul" onclick="Xmul()">*</button>
            <button class="equ" onclick="Xequ()">=</button>
        </div>
    </div>
    <script src="jscript/calculator.js">
    </script>
</body>
</html>
